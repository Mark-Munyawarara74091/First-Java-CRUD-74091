<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>First Java CRUD — Product Manager</title>
  <style>
    :root{font-family:system-ui,Arial,sans-serif;color:#16243b;background:#eef3fb}*{box-sizing:border-box}
    main{max-width:850px;margin:55px auto;padding:30px;background:white;border-radius:18px;box-shadow:0 12px 40px #172d4d19}
    h1{margin:0;color:#193e83}p{color:#617089}form{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}
    input{padding:12px;border:1px solid #c8d3e4;border-radius:8px;flex:1;min-width:130px;font:inherit}
    button{border:0;border-radius:8px;padding:11px 15px;background:#2456a6;color:white;cursor:pointer;font-weight:600}
    button:hover{filter:brightness(.9)}button.danger{background:#bd3947}button.secondary{background:#718096}
    table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:14px;border-bottom:1px solid #e4eaf2}th{background:#f5f8fc}
    td:last-child{white-space:nowrap}td button{margin:2px}#message{min-height:24px;font-weight:600}#message.error{color:#bd3947}
    @media(max-width:550px){main{margin:15px;padding:18px}td,th{padding:8px}button{padding:9px}}
  </style>
</head>
<body><main>
  <h1>Product Manager</h1><p>First Java CRUD • Spring Boot + H2 Database</p>
  <form id="productForm">
    <input type="hidden" id="productId">
    <input id="name" placeholder="Product name" maxlength="150" required aria-label="Product name">
    <input id="price" type="number" placeholder="Price" min="0" step="0.01" required aria-label="Price">
    <button type="submit" id="saveButton">Add Product</button>
    <button type="button" id="cancelButton" class="secondary" hidden>Cancel</button>
  </form>
  <div id="message" role="status" aria-live="polite"></div>
  <table><thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Actions</th></tr></thead><tbody id="products"></tbody></table>
</main>
<script>
const api='/api/products';
const form=document.getElementById('productForm'), idInput=document.getElementById('productId');
const nameInput=document.getElementById('name'),priceInput=document.getElementById('price');
const table=document.getElementById('products'),message=document.getElementById('message');
let products=[];
function notice(text,error=false){message.textContent=text;message.className=error?'error':'';}
function reset(){form.reset();idInput.value='';document.getElementById('saveButton').textContent='Add Product';document.getElementById('cancelButton').hidden=true;}
async function request(url,options){const res=await fetch(url,options);if(!res.ok){let info;try{info=await res.json()}catch{}throw Error(info?.detail||info?.message||`Request failed (${res.status})`)}return res.status===204?null:res.json()}
async function load(){try{products=await request(api);render()}catch(e){notice(e.message,true)}}
function render(){table.replaceChildren();if(!products.length){const tr=table.insertRow();const td=tr.insertCell();td.colSpan=4;td.textContent='No products yet. Add your first product above.';return;}
for(const p of products){const tr=table.insertRow();for(const value of [p.id,p.name,Number(p.price).toFixed(2)])tr.insertCell().textContent=value;
const actions=tr.insertCell(),edit=document.createElement('button'),del=document.createElement('button');edit.textContent='Edit';edit.addEventListener('click',()=>{idInput.value=p.id;nameInput.value=p.name;priceInput.value=p.price;document.getElementById('saveButton').textContent='Save Changes';document.getElementById('cancelButton').hidden=false;nameInput.focus()});
del.textContent='Delete';del.className='danger';del.addEventListener('click',async()=>{if(!confirm(`Delete ${p.name}?`))return;try{await request(`${api}/${p.id}`,{method:'DELETE'});notice('Product deleted');reset();await load()}catch(e){notice(e.message,true)}});actions.append(edit,del)}}
form.addEventListener('submit',async e=>{e.preventDefault();const id=idInput.value;const payload={name:nameInput.value.trim(),price:Number(priceInput.value)};try{await request(id?`${api}/${id}`:api,{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});notice(id?'Product updated':'Product added');reset();await load()}catch(err){notice(err.message,true)}});
document.getElementById('cancelButton').addEventListener('click',reset);load();
</script></body></html>
